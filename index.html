<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration System</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

    <h1>Student Registration System</h1>

    <form id="registrationForm">

        <label>Student Name</label>
        <input type="text" id="name" placeholder="Enter your full name">
        <small id="nameError"></small>

        <label>Roll Number</label>
        <input type="text" id="roll" placeholder="Enter roll number">
        <small id="rollError"></small>

        <label>Email</label>
        <input type="text" id="email" placeholder="example@gmail.com">
        <small id="emailError"></small>

        <label>Phone Number</label>
        <input type="text" id="phone" placeholder="10 digit phone number">
        <small id="phoneError"></small>

        <label>Date of Birth</label>
        <input type="date" id="dob">
        <small id="dobError"></small>

        <label>Gender</label>

        <div class="gender">
            <input type="radio" name="gender" value="Male"> Male
            <input type="radio" name="gender" value="Female"> Female
            <input type="radio" name="gender" value="Other"> Other
        </div>

        <small id="genderError"></small>

        <label>Course</label>

        <select id="course">
            <option value="">-- Select Course --</option>
            <option value="BCA">BCA</option>
            <option value="BSc">BSc</option>
            <option value="BCom">BCom</option>
            <option value="BE">BE</option>
            <option value="BBA">BBA</option>
        </select>

        <small id="courseError"></small>

        <label>Password</label>
        <input type="password" id="password"
               placeholder="Minimum 8 characters">
        <small id="passwordError"></small>

        <label>Confirm Password</label>
        <input type="password" id="confirmPassword"
               placeholder="Re-enter password">
        <small id="confirmPasswordError"></small>

        <button type="submit">Register</button>

        <div id="successMessage"></div>

    </form>

</div>

<script src="script.js"></script>

</body>
</html>
